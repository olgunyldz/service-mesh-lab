# Kısa ömürlü veritabanı kullanıcısı: her yenilemede Vault yeni kullanıcı üretir (ömür DB_CREDS_TTL), servis
# dosyadan okur. Eski kullanıcı ömrü dolunca Vault tarafından silinir.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: device-registry-db
  namespace: iam
spec:
  path: /database/creds/device-registry
  method: GET
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    auth:
      jwt:
        path: jwt-mgmt
        role: iam
        kubernetesServiceAccountToken:
          serviceAccountRef:
            name: vault-reader
            audiences: [vault]
          expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: device-registry-db
  namespace: iam
spec:
  refreshInterval: 30m
  target:
    name: device-registry-db
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: device-registry-db
---
