# Secret'lar Vault'tan (13 · secrets). Vault aynı cluster'da: SecretStore doğrudan vault.vault:8200 (mesh mTLS).
# Her namespace'in kendi SecretStore'u, vault-reader token'ı (JWT auth jwt-mgmt, rol = namespace) ve politikası var:
# yalnızca kv/mgmt/<namespace>/*. device-registry-db: Vault Database motorunun kısa ömürlü kullanıcısı.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: data
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: data
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-mgmt
          role: data
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: vault-reader
              audiences: [vault]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-admin
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: postgres-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mgmt/data/postgres-admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-users
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: postgres-app-users
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mgmt/data/postgres-app-users
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-acl
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: valkey-acl
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: mgmt/data/valkey-acl
---
