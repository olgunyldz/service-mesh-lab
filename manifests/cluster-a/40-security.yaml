# Mesh içi zorunlu mTLS
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# Varsayılan reddet (deny-by-default): api-a namespace'inde açıkça izin verilmeyen her şey reddedilir.
# Seçicisiz politika ambient'te ztunnel tarafından L4'te uygulanır.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-nothing
  namespace: api-a
spec: {}
---
# api-a pod'larına L4'te yalnızca namespace'in waypoint'i ulaşabilir
# (ingress gateway'den gelen trafik de waypoint üzerinden gelir).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-a-allow-waypoint
  namespace: api-a
spec:
  selector:
    matchLabels:
      app: api-a
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/api-a/sa/waypoint
---
# L7 (waypoint'te): api-a servisine yalnızca internal ingress gateway ve web-bff (channel-bff), GET/POST, geçerli iç JWT ile.
# Kanal kuralı (09b): müşteri ve personel kanalları serbest; partner yalnızca info:read scope'u varsa (partner başına yetki).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-a-allow-ingress
  namespace: api-a
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: api-a
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-ingress/sa/istio-ingressgateway
              - corp.mesh/ns/channel-bff/sa/web-bff
            requestPrincipals: ["https://sso.apps.example.local:8443/realms/customers/*",
                                "https://sso.apps.example.local:8443/realms/partners/*",
                                "https://sso.apps.example.local:8443/realms/staff/*"]
      to:
        - operation:
            methods: ["GET", "POST"]
      when:
        - key: request.auth.claims[channel]
          values: ["web", "mobile", "branch"]
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-ingress/sa/istio-ingressgateway
              - corp.mesh/ns/channel-bff/sa/web-bff
            requestPrincipals: ["https://sso.apps.example.local:8443/realms/customers/*",
                                "https://sso.apps.example.local:8443/realms/partners/*",
                                "https://sso.apps.example.local:8443/realms/staff/*"]
      to:
        - operation:
            methods: ["GET"]
      when:
        - key: request.auth.claims[channel]
          values: ["partner"]
        - key: request.auth.claims[scope]
          values: ["info:read"]
---
# Egress gateway'e yalnızca api-a'nın waypoint'i girebilir (dışarıya çıkış tek ve bilinen bir kimlikten),
# yalnızca 443'ten. Veri portları ayrı politikada (55-data-exit.yaml)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-only-waypoints
  namespace: istio-egress
spec:
  selector:
    matchLabels:
      istio: egressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/api-a/sa/waypoint
      to:
        - operation:
            ports: ["443"]
