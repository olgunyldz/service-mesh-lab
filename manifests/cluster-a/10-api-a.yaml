# api-a: podinfo. cluster-b aktifken /api/echo çağrısı backend olarak api-b'ye egress üzerinden gider
# (backend adresi cluster-b/05-api-a-backend.yaml ConfigMap'inden gelir; yoksa yalnızca echo yapar).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-a
  namespace: api-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-a
  namespace: api-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-a
  template:
    metadata:
      labels:
        app: api-a
        version: v1
    spec:
      serviceAccountName: api-a
      securityContext:
        runAsNonRoot: true
        runAsUser: 100   # imajdaki "app" kullanıcısı
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command:
            - ./podinfo
            - --port=9898
            - --level=info
          envFrom:
            - configMapRef:
                name: api-a-backend   # PODINFO_BACKEND_URL
                optional: true
          env:
            - name: PODINFO_UI_MESSAGE
              value: "api-a @ cluster-a"
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # yazılabilir yerler yalnızca aşağıdaki emptyDir'ler
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-a
  namespace: api-a
  labels:
    istio.io/ingress-use-waypoint: "true"   # ingress gateway trafiği de waypoint'ten geçsin
spec:
  selector:
    app: api-a
  ports:
    - name: http
      port: 80
      targetPort: 9898
