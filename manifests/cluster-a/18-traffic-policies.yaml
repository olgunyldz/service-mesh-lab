# Trafik yönetimi (12 · traffic-mgmt). Kurallar hedef servisin waypoint'inde uygulanır (ambient).
#
# account-api: canary (v1 %90 / v2 %10), zaman aşımı; yeniden deneme yalnızca GET'te (POST transfer tekrarlanmaz:
#   çift işlem riski); bağlantı havuzu sınırı (circuit breaker) ve hatalı pod'un havuzdan çıkarılması (outlier detection)
# api-a: GET'lerde bağlantı hatası / 503'te yeniden deneme; outlier detection (2 replika: biri çıkarılınca diğeri hizmet verir)
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: account-api
  namespace: account-api
spec:
  host: account-api.account-api.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 20        # aşılırsa hemen 503 (UO): sıraya yığılıp gecikmeyi büyütmesin
        maxRequestsPerConnection: 0
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 15s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: account-api
  namespace: account-api
spec:
  hosts:
    - account-api.account-api.svc.cluster.local
  http:
    - name: read
      match:
        - method:
            exact: GET
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v2
          weight: 10
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    - name: write   # POST (transfer, onay): yeniden deneme yok
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v2
          weight: 10
      timeout: 5s
      retries:
        attempts: 0
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-a
  namespace: api-a
spec:
  host: api-a.api-a.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 5s
      baseEjectionTime: 15s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-a
  namespace: api-a
spec:
  hosts:
    - api-a.api-a.svc.cluster.local
  http:
    - name: read
      match:
        - method:
            exact: GET
      route:
        - destination:
            host: api-a.api-a.svc.cluster.local
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: connect-failure,refused-stream,unavailable,503
    - name: other
      route:
        - destination:
            host: api-a.api-a.svc.cluster.local
      timeout: 5s
