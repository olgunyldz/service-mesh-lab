# Egress akışı:
#   api-a pod -> ztunnel -> waypoint (api-a ns) -> istio-egressgateway --mTLS--> cluster-b ingress gw
#   api-a pod -> ztunnel -> waypoint (api-a ns) -> istio-egressgateway -> httpbin.org
# __NET_PREFIX__ scriptte doldurulur.

# --- Dış hedefler (api-a namespace'inde; waypoint bunları işler) ---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: api-b-remote
  namespace: api-a
  labels:
    istio.io/use-waypoint: waypoint
spec:
  hosts:
    - api-b.apps.example.local
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 80
      name: http
      protocol: HTTP
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: httpbin-ext
  namespace: api-a
  labels:
    istio.io/use-waypoint: waypoint
spec:
  hosts:
    - httpbin.org
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 80
      name: http
      protocol: HTTP
---
# Waypoint: dış hedefleri egress gateway'e yönlendir
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: via-egress
  namespace: api-a
spec:
  hosts:
    - api-b.apps.example.local
    - httpbin.org
  http:
    - route:
        - destination:
            host: istio-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 443
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: egressgateway
  namespace: api-a
spec:
  host: istio-egressgateway.istio-egress.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
# --- Egress gateway tarafı ---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: egress
  namespace: istio-egress
spec:
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 443
        name: https-mtls
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
      # Waypoint, Istio'nun iç SNI'ını (outbound_.443_._.istio-egressgateway...) gönderir;
      # hedef SNI'larıyla eşleşmez. Kimlik mTLS ile doğrulanır, yönlendirme VirtualService'te.
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: cluster-b-gateway
  namespace: istio-egress
spec:
  hosts:
    - cluster-b.internal.mesh
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 443
      name: http-mtls
      protocol: HTTP
  endpoints:
    - address: __NET_PREFIX__.202.10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: cluster-b-gateway
  namespace: istio-egress
spec:
  host: cluster-b.internal.mesh
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      sni: api-b.apps.example.local
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: httpbin-ext
  namespace: istio-egress
spec:
  hosts:
    - httpbin.org
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 80
      name: http
      protocol: HTTP
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: egress-routes
  namespace: istio-egress
spec:
  hosts:
    - api-b.apps.example.local
    - httpbin.org
  gateways:
    - egress
  http:
    - match:
        - authority:
            exact: api-b.apps.example.local
      route:
        - destination:
            host: cluster-b.internal.mesh
            port:
              number: 443
    - match:
        - authority:
            exact: httpbin.org
      route:
        - destination:
            host: httpbin.org
            port:
              number: 80
