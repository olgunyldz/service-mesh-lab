# Egress akışı:
#   api-a pod -> ztunnel -> waypoint (api-a ns) -> istio-egressgateway -> httpbin.org
# cluster-b aktifken api-b'ye çıkış: cluster-b/51-egress-cluster-b.yaml

# --- Dış hedef (api-a namespace'inde; waypoint bunu işler) ---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: httpbin-ext
  namespace: api-a
  labels:
    istio.io/use-waypoint: waypoint
spec:
  hosts:
    - httpbin.org
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 80
      name: http
      protocol: HTTP
---
# Waypoint: dış hedefi egress gateway'e yönlendir
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: via-egress
  namespace: api-a
spec:
  hosts:
    - httpbin.org
  http:
    - route:
        - destination:
            host: istio-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 443
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: egressgateway
  namespace: api-a
spec:
  host: istio-egressgateway.istio-egress.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
# --- Egress gateway tarafı ---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: egress
  namespace: istio-egress
spec:
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 443
        name: https-mtls
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
      # Waypoint, Istio'nun iç SNI'ını (outbound_.443_._.istio-egressgateway...) gönderir;
      # hedef SNI'larıyla eşleşmez. Kimlik mTLS ile doğrulanır, yönlendirme VirtualService'te.
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: httpbin-ext
  namespace: istio-egress
spec:
  hosts:
    - httpbin.org
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: 80
      name: http
      protocol: HTTP
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: egress-httpbin
  namespace: istio-egress
spec:
  hosts:
    - httpbin.org
  gateways:
    - egress
  http:
    - route:
        - destination:
            host: httpbin.org
            port:
              number: 80
