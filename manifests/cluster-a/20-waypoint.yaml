# Waypoint: api-a namespace'i için L7 proxy (Gateway API, istio-waypoint class).
# Namespace "restricted" Pod Security kullandığı için üretilen deployment'a seccomp eklenir
# (OpenShift'te restricted-v2 SCC bunu otomatik yapar).
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-options
  namespace: api-a
data:
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: api-a
  labels:
    # Yalnızca servis trafiği. "all" olunca pod IP trafiği de waypoint'ten geçiyor, waypoint onu yetkili
    # kimlikle iletiyor ve Servis'e bağlı L7 politikası uygulanmıyordu (pod IP ile L7 AuthZ atlanabiliyordu).
    # "service" ile pod IP trafiği ztunnel'de L4 kuralına (yalnızca waypoint) takılır.
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-options
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
