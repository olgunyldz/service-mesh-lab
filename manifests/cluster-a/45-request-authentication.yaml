# İç JWT doğrulaması (08 · token-exchange, 09a · idp-token-exchange). İç JWT'yi Keycloak imzalar: DMZ'deki auth-service
# dış token'ı RFC 8693 token exchange ile çevirir. Realm başına issuer (customers, partners, staff), aud=internal-apis.
# Açık anahtarlar inline JWKS (__IDP_JWKS_<realm>__: certs/idp/<realm>.jwks.json, apply_rendered doldurur): internal'dan
# IdP'ye ağ çağrısı yok. Anahtar değişiminde eski ve yeni anahtar bir süre birlikte yayınlanır.
# Doğrulama ingress gateway'de ve servislerin waypoint'lerinde yapılır (JWT x-user-jwt ile aynen iletilir).
# Not: RequestAuthentication tek başına JWT'siz isteği reddetmez; zorunluluk AuthorizationPolicy'lerdeki
# requestPrincipals ile (30-internal-gateway.yaml, 40-security.yaml, 15-account-api.yaml, 16-channel-bff.yaml).
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: internal-jwt
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: https://sso.apps.example.local:8443/realms/customers
      audiences: ["internal-apis"]
      jwks: '__IDP_JWKS_customers__'
      fromHeaders:
        - name: x-user-jwt
      forwardOriginalToken: true
      spaceDelimitedClaims: ["scope"]   # "accounts:read transfers:write" -> liste (AuthZ'de tek tek eşleşir; 09b)
    - issuer: https://sso.apps.example.local:8443/realms/partners
      audiences: ["internal-apis"]
      jwks: '__IDP_JWKS_partners__'
      fromHeaders:
        - name: x-user-jwt
      forwardOriginalToken: true
      spaceDelimitedClaims: ["scope"]   # "accounts:read transfers:write" -> liste (AuthZ'de tek tek eşleşir; 09b)
    - issuer: https://sso.apps.example.local:8443/realms/staff
      audiences: ["internal-apis"]
      jwks: '__IDP_JWKS_staff__'
      fromHeaders:
        - name: x-user-jwt
      forwardOriginalToken: true
      spaceDelimitedClaims: ["scope"]   # "accounts:read transfers:write" -> liste (AuthZ'de tek tek eşleşir; 09b)
---
