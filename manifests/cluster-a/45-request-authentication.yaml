# İç JWT doğrulaması (08 · token-exchange). JWT'yi DMZ'deki auth-service imzalar (x-user-jwt header'ı).
# Açık anahtar inline JWKS (__INTERNAL_JWKS__: certs/auth/jwks.json, apply_rendered doldurur): internal'dan DMZ'ye
# ağ çağrısı yok. Anahtar değişiminde eski ve yeni anahtar bir süre birlikte yayınlanır.
# Doğrulama hem ingress gateway'de hem de servislerin waypoint'inde yapılır (JWT aynen iletilir).
# Not: RequestAuthentication tek başına JWT'siz isteği reddetmez; zorunluluk AuthorizationPolicy'lerdeki
# requestPrincipals ile (30-internal-gateway.yaml, 40-security.yaml, 15-account-api.yaml).
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: internal-jwt
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  jwtRules:
    - issuer: auth.dmz.corp.mesh
      audiences: ["internal-apis"]
      jwks: '__INTERNAL_JWKS__'
      fromHeaders:
        - name: x-user-jwt
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: internal-jwt
  namespace: api-a
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: api-a
  jwtRules:
    - issuer: auth.dmz.corp.mesh
      audiences: ["internal-apis"]
      jwks: '__INTERNAL_JWKS__'
      fromHeaders:
        - name: x-user-jwt
      forwardOriginalToken: true
---
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: internal-jwt
  namespace: account-api
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: account-api
  jwtRules:
    - issuer: auth.dmz.corp.mesh
      audiences: ["internal-apis"]
      jwks: '__INTERNAL_JWKS__'
      fromHeaders:
        - name: x-user-jwt
      forwardOriginalToken: true
