# Internal ingress gateway: sadece DMZ'den mTLS (ISTIO_MUTUAL) ile gelen trafiği kabul eder.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https-mtls
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
      hosts:
        - api-a.apps.example.local
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-a
  namespace: istio-ingress
spec:
  hosts:
    - api-a.apps.example.local
  gateways:
    - internal-gateway
  http:
    # Hesap API'si (07 · data): /accounts* -> account-api (PostgreSQL'den okur)
    - match:
        - uri:
            prefix: /accounts
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            port:
              number: 8080
    - route:
        - destination:
            host: api-a.api-a.svc.cluster.local
            port:
              number: 80
---
# Zone geçişinde tek kapı: yalnızca DMZ egress gateway kimliği girebilir.
# dmz-ingressgateway artık doğrudan kabul edilmez. cluster-b aktifken onun egress'i de
# cluster-b/35-allow-cluster-b-egress.yaml ile eklenir (ALLOW politikaları toplanır).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-only-dmz-egress
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-egress/sa/dmz-egressgateway
