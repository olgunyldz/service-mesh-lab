# Internal ingress gateway: sadece DMZ'den mTLS (ISTIO_MUTUAL) ile gelen trafiği kabul eder.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: internal-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https-mtls
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
      hosts:
        - api-a.apps.example.local
        - web-bff.apps.example.local   # web kanalının BFF'i (09a): DMZ token handler -> egress -> buraya
        - mobile-bff.apps.example.local   # mobil kanalın BFF'i (09c): DMZ mobile-gateway -> egress -> buraya
        - branch-bff.apps.example.local   # şube kanalının BFF'i (09e): DMZ branch-gateway -> egress -> buraya
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-a
  namespace: istio-ingress
spec:
  hosts:
    - api-a.apps.example.local
  gateways:
    - internal-gateway
  http:
    # Hesap API'si (07 · data): /accounts* ve /products (09b) -> account-api
    - match:
        - uri:
            prefix: /accounts
        - uri:
            prefix: /products
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            port:
              number: 8080
    - route:
        - destination:
            host: api-a.api-a.svc.cluster.local
            port:
              number: 80
---
# Web kanalı (09a): BFF internal'da. Aynı SNI (api-a.apps.example.local) ile gelir, Host'a göre ayrılır.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web-bff
  namespace: istio-ingress
spec:
  hosts:
    - web-bff.apps.example.local
  gateways:
    - internal-gateway
  http:
    - route:
        - destination:
            host: web-bff.channel-bff.svc.cluster.local
            port:
              number: 8080
---
# Mobil kanal (09c): BFF internal'da; mobil trafik domain servislerine yalnızca mobile-bff üzerinden gider
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: mobile-bff
  namespace: istio-ingress
spec:
  hosts:
    - mobile-bff.apps.example.local
  gateways:
    - internal-gateway
  http:
    - route:
        - destination:
            host: mobile-bff.channel-bff.svc.cluster.local
            port:
              number: 8080
      timeout: 10s
---
# Şube kanalı (09e): BFF internal'da; şube trafiği domain servislerine yalnızca branch-bff üzerinden gider
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: branch-bff
  namespace: istio-ingress
spec:
  hosts:
    - branch-bff.apps.example.local
  gateways:
    - internal-gateway
  http:
    - route:
        - destination:
            host: branch-bff.channel-bff.svc.cluster.local
            port:
              number: 8080
      timeout: 10s
---
# Zone geçişinde tek kapı: yalnızca DMZ egress gateway kimliği girebilir, ve yalnızca Keycloak'ın (realm başına issuer)
# imzaladığı geçerli bir iç JWT ile (requestPrincipals: 45-request-authentication.yaml; 09a).
# dmz-ingressgateway artık doğrudan kabul edilmez. cluster-b aktifken onun egress'i de
# cluster-b/35-allow-cluster-b-egress.yaml ile eklenir (ALLOW politikaları toplanır).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-only-dmz-egress
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-egress/sa/dmz-egressgateway
            requestPrincipals: ["https://sso.apps.example.local:8443/realms/customers/*",
                                "https://sso.apps.example.local:8443/realms/partners/*",
                                "https://sso.apps.example.local:8443/realms/staff/*"]
