# Secret'lar Vault'tan (13 · secrets). External Secrets (ns external-secrets) her namespace'in kendi SecretStore'u ile okur:
#   SecretStore -> vault-reader service account'unun token'ı (audience vault) -> Vault JWT auth (jwt-cluster-a, rol = namespace)
#   -> politika <cluster>-<namespace>: yalnızca kv/<cluster>/<namespace>/*. Başka namespace'in yolunu okuyamaz.
# Vault mgmt'te: istek namespace'in waypoint'i ve egress gateway üzerinden mTLS ile mgmt girişine gider (64-vault-exit.yaml).
# vault-reader yalnızca kimlik içindir: hiçbir pod onunla çalışmaz, token'ı otomatik bağlanmaz.
# account-api-db: Vault Database motorunun kısa ömürlü PostgreSQL kullanıcısı (VaultDynamicSecret), 30 dk'da bir yenilenir.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: api-a
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: api-a
spec:
  provider:
    vault:
      server: http://vault.external-secrets.svc.cluster.local
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-cluster-a
          role: api-a
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: vault-reader
              audiences: [vault]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-a-cache
  namespace: api-a
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: api-a-cache
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster-a/api-a/api-a-cache
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: channel-bff
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: channel-bff
spec:
  provider:
    vault:
      server: http://vault.external-secrets.svc.cluster.local
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-cluster-a
          role: channel-bff
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: vault-reader
              audiences: [vault]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attest-public
  namespace: channel-bff
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: attest-public
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cluster-a/channel-bff/attest-public
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: account-api
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: account-api
spec:
  provider:
    vault:
      server: http://vault.external-secrets.svc.cluster.local
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-cluster-a
          role: account-api
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: vault-reader
              audiences: [vault]
            expirationSeconds: 600
---
# Kısa ömürlü veritabanı kullanıcısı: her yenilemede Vault yeni kullanıcı üretir (ömür DB_CREDS_TTL), servis
# dosyadan okur. Eski kullanıcı ömrü dolunca Vault tarafından silinir.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: account-api-db
  namespace: account-api
spec:
  path: /database/creds/account-api
  method: GET
  provider:
    server: http://vault.external-secrets.svc.cluster.local
    auth:
      jwt:
        path: jwt-cluster-a
        role: account-api
        kubernetesServiceAccountToken:
          serviceAccountRef:
            name: vault-reader
            audiences: [vault]
          expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: account-api-db
  namespace: account-api
spec:
  refreshInterval: 30m
  target:
    name: account-api-db
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: account-api-db
