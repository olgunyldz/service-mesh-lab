# web-bff (services/web-bff): web kanalının BFF'i, internal'da (09a; dokümandaki channel-bff namespace'i). Akış:
#   DMZ web-token-handler -> dmz-egressgateway -> internal ingress gw -> waypoint (channel-bff) -> web-bff
#   -> waypoint (api-a / account-api) -> api-a / account-api
# İç JWT her adımda doğrulanır: ingress gw, channel-bff waypoint'i ve domain servislerinin waypoint'leri.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-bff
  namespace: channel-bff
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bff
  namespace: channel-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-bff
  template:
    metadata:
      labels:
        app: web-bff
        version: v1
    spec:
      serviceAccountName: web-bff
      automountServiceAccountToken: false   # Kubernetes API'ye ihtiyacı yok
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # distroless "nonroot"
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: lab-registry:5000/lab/web-bff:0.4.0   # build + imza: 03b-publish-images.sh
          env:
            - name: API_URL
              value: http://api-a.api-a.svc.cluster.local
            - name: ACCOUNTS_URL
              value: http://account-api.account-api.svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-bff
  namespace: channel-bff
  labels:
    istio.io/ingress-use-waypoint: "true"   # ingress gateway trafiği de waypoint'ten geçsin (L7 AuthZ, JWT)
spec:
  selector:
    app: web-bff
  ports:
    - name: http
      port: 8080
---
# Waypoint: channel-bff namespace'i için L7 proxy (yalnızca servis trafiği; bkz. 20-waypoint.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-options
  namespace: channel-bff
data:
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: channel-bff
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-options
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# --- Yetkilendirme: varsayılan reddet ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-nothing
  namespace: channel-bff
spec: {}
---
# Pod'lara L4'te yalnızca namespace'in waypoint'i
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: web-bff-allow-waypoint
  namespace: channel-bff
spec:
  selector:
    matchLabels:
      app: web-bff
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/channel-bff/sa/waypoint
---
# L7 (waypoint'te): web-bff'e yalnızca internal ingress gateway, müşteri realm'inin iç JWT'siyle ve yalnızca web
# kanalından (channel claim'i Keycloak'taki auth-web exchange client'ından gelir; DMZ değiştiremez)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: web-bff-allow-web-channel
  namespace: channel-bff
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: web-bff
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-ingress/sa/istio-ingressgateway
            requestPrincipals: ["https://sso.apps.example.local:8443/realms/customers/*"]
      to:
        - operation:
            methods: ["GET", "POST"]
      when:
        - key: request.auth.claims[channel]
          values: ["web"]
