# Yalnızca cluster-b aktifken uygulanır. __NET_PREFIX__ scriptte doldurulur.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: cluster-b-gateway
  namespace: istio-ingress
spec:
  hosts:
    - cluster-b.internal.mesh
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 443
      name: http-mtls
      protocol: HTTP
  endpoints:
    - address: __NET_PREFIX__.202.10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: cluster-b-gateway
  namespace: istio-ingress
spec:
  host: cluster-b.internal.mesh
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      sni: api-b.apps.example.local
