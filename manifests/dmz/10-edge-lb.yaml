# Edge Load Balancer (F5 / OpenShift Router simülasyonu).
# Host:8080 -> NodePort 30080 -> HAProxy -> dmz-ingressgateway
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: edge-lb
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
    defaults
      log global
      timeout connect 5s
      timeout client  30s
      timeout server  30s

    frontend http_in
      mode http
      option httplog
      bind :8080
      http-request set-header X-Forwarded-Proto http
      default_backend istio_ingress_http

    frontend https_in
      mode tcp
      bind :8443
      default_backend istio_ingress_https

    backend istio_ingress_http
      mode http
      balance roundrobin
      server gw dmz-ingressgateway.istio-ingress.svc.cluster.local:80 check

    backend istio_ingress_https
      mode tcp
      server gw dmz-ingressgateway.istio-ingress.svc.cluster.local:443 check
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-lb
  namespace: edge-lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-lb
  template:
    metadata:
      labels:
        app: edge-lb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99   # imajdaki "haproxy" kullanıcısı; isimle runAsNonRoot doğrulanamıyor
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haproxy
          image: haproxy:3.0-alpine
          ports:
            - containerPort: 8080
            - containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
      volumes:
        - name: config
          configMap:
            name: haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: edge-lb
  namespace: edge-lb
spec:
  type: NodePort
  selector:
    app: edge-lb
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
