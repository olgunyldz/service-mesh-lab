# Global rate limit (07 · data): partner başına kota, tüm gateway pod'ları ortak sayaçla.
#   partner-gateway --gRPC--> ratelimit (ns ratelimit) --> [valkey Service, waypoint] --> dmz-egressgateway :16379
#   --mTLS--> mgmt ingress gw :6379 --> data/valkey (ratelimit kullanıcısı, yalnızca rl:* anahtarları)
# Local rate limit (25-rate-limits.yaml) kalır: o pod başına anlık koruma, bu sözleşmedeki kota.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimit-config
  namespace: ratelimit
data:
  # Partner sözleşmesindeki kotalar (dakika başına). Listede olmayan partner'a kota uygulanmaz
  # (izin listesi zaten partner-gateway AuthZ'sinde).
  config.yaml: |
    domain: partner
    descriptors:
      - key: partner_id
        value: acme
        rate_limit:
          unit: minute
          requests_per_unit: 1000
      - key: partner_id
        value: initech
        rate_limit:
          unit: minute
          requests_per_unit: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ratelimit
  namespace: ratelimit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit
  namespace: ratelimit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratelimit
  template:
    metadata:
      labels:
        app: ratelimit
    spec:
      serviceAccountName: ratelimit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ratelimit
          image: lab-registry:5000/lab/ratelimit:f4e76690
          command: ["/bin/ratelimit"]
          env:
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: valkey.ratelimit.svc.cluster.local:6379   # seçicisiz Service (waypoint -> egress -> mgmt)
            - name: CACHE_KEY_PREFIX
              value: "rl:"   # Valkey ACL: ratelimit kullanıcısı yalnızca rl:* anahtarlarına
            - name: USE_STATSD
              value: "false"
            - name: DISABLE_STATS   # istatistikler yoksa varsayılan "logging sink" her saniye debug log basıyor
              value: "true"
            - name: LOG_LEVEL
              value: warn
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: RUNTIME_IGNOREDOTFILES   # ConfigMap'in gizli ..data kopyası "duplicate domain" hatası verdiriyor
              value: "true"
          envFrom:
            - secretRef:
                name: ratelimit-redis   # REDIS_AUTH=ratelimit:<parola> (05b-create-data-secrets.sh)
          ports:
            - name: grpc
              containerPort: 8081
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
          # Başlarken Valkey'e (mgmt) bağlanamazsa bağlantıyı bekleyip takılıyor ve portları hiç açmıyor;
          # sıfırdan kurulumda DMZ, mgmt'ten önce kurulur. Takılırsa yeniden başlatılsın.
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit
  namespace: ratelimit
  labels:
    istio.io/use-waypoint: none   # gateway'den gelen gRPC doğrudan (ztunnel); waypoint yalnızca çıkış için
spec:
  selector:
    app: ratelimit
  ports:
    - name: grpc
      port: 8081
      appProtocol: grpc
---
# --- Çıkış: Valkey (mgmt) ---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: ratelimit
spec:
  ports:
    - name: tcp-valkey
      port: 6379
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: valkey-via-egress
  namespace: ratelimit
spec:
  hosts:
    - valkey.ratelimit.svc.cluster.local
  tcp:
    - route:
        - destination:
            host: dmz-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 16379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-options
  namespace: ratelimit
data:
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: ratelimit
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-options
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# --- Yetkilendirme ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-nothing
  namespace: ratelimit
spec: {}
---
# ratelimit servisine yalnızca partner-gateway, yalnızca gRPC portu (ztunnel, L4)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: ratelimit-allow-partner-gateway
  namespace: ratelimit
spec:
  selector:
    matchLabels:
      app: ratelimit
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-partner/sa/partner-gateway
      to:
        - operation:
            ports: ["8081"]
---
# Valkey çıkışını (valkey Service, waypoint) yalnızca ratelimit kullanabilir
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: valkey-allow-ratelimit
  namespace: ratelimit
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: valkey
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/ratelimit/sa/ratelimit
---
# --- Partner gateway: global rate limit filtresi ve tanımlayıcı (x-partner-id -> partner_id) ---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: partner-global-rate-limit
  namespace: istio-partner
spec:
  workloadSelector:
    labels:
      istio: partner-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
            domain: partner
            # ratelimit servisine ulaşılamazsa istek geçer (fail-open): kota kontrolü erişilebilirliği düşürmesin.
            # Local rate limit her durumda koruma sağlar.
            failure_mode_deny: false
            timeout: 0.5s
            rate_limit_service:
              transport_api_version: V3
              grpc_service:
                envoy_grpc:
                  cluster_name: outbound|8081||ratelimit.ratelimit.svc.cluster.local
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: partner-api.apps.example.local:443
      patch:
        operation: MERGE
        value:
          rate_limits:
            - actions:
                - request_headers:
                    header_name: x-partner-id
                    descriptor_key: partner_id
