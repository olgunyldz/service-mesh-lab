# DMZ ingress gateway: edge-waf'tan gelen *.apps.example.local trafiğini karşılar.
# Internal'a doğrudan gitmez; her şeyi DMZ egress gateway'e verir (zone geçişinde tek kapı).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: dmz-ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.apps.example.local"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-a
  namespace: istio-ingress
spec:
  hosts:
    - api-a.apps.example.local
  gateways:
    - public-gateway
  http:
    - route:
        - destination:
            host: dmz-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 443
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 4s
---
# ingress gw -> egress gw: mesh kimlikleriyle mTLS
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: dmz-egressgateway
  namespace: istio-ingress
spec:
  host: dmz-egressgateway.istio-egress.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
# api-b rotası: cluster-b/21-api-b-route.yaml (yalnızca cluster-b aktifken uygulanır)
