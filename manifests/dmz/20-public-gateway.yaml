# Web kanalı: dmz-ingressgateway, edge-waf'tan gelen www.apps.example.local trafiğini web-bff'e verir.
# Internal'a kendisi çıkamaz (dmz-egressgateway yalnızca kanal gateway'lerini ve BFF'in waypoint'ini kabul eder).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: dmz-ingressgateway
  servers:
    # Yalnızca karşılıklı TLS: istemci sertifikası Edge-DMZ Zone CA'sından olmalı (yalnızca edge-waf'ta var).
    # Düz HTTP (80) sunucusu yok. Secret: dmz-ingress-mtls (tls.crt, tls.key, ca.crt; 05-install-gateways.sh)
    - port:
        number: 443
        name: https-mtls
        protocol: HTTPS
      tls:
        mode: MUTUAL
        credentialName: dmz-ingress-mtls
        minProtocolVersion: TLSV1_2
      hosts:
        - "*.apps.example.local"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web
  namespace: istio-ingress
spec:
  hosts:
    - www.apps.example.local
  gateways:
    - public-gateway
  http:
    - headers:
        request:
          # Kanal etiketi gateway'de yazılır; dışarıdan gelen değer ezilir. Partner kimliği bu kanalda yok sayılır.
          set:
            x-channel: web
          remove:
            - x-partner-id
      # Tarayıcı kanalı: yalnızca kendi origin'imizden gelen çapraz istekler (lab'de 8443 portuyla da)
      corsPolicy:
        allowOrigins:
          - exact: https://www.apps.example.local
          - exact: https://www.apps.example.local:8443
        allowMethods: [GET, POST]
        allowHeaders: [content-type, authorization, x-request-id]
        exposeHeaders: [x-request-id]
        allowCredentials: true
        maxAge: 1h
      route:
        - destination:
            host: web-bff.web-bff.svc.cluster.local
            port:
              number: 8080
      timeout: 10s
      retries:
        attempts: 2
        perTryTimeout: 4s
# api-b rotası: cluster-b/21-api-b-route.yaml (yalnızca cluster-b aktifken uygulanır)
