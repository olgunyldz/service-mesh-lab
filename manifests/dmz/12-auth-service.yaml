# auth-service (services/auth-service): kanal gateway'lerinin ext_authz servisi.
#   kanal gateway'i --ext_authz (HTTP)--> auth-service --> [keycloak Service, waypoint] --> dmz-egressgateway --> mgmt Keycloak (JWKS)
# Dış access token'ı doğrular, kanal kurallarını uygular, iç JWT'yi (RS256, 5 dk) imzalar.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth
spec:
  replicas: 1   # gerçekte en az 2: ext_authz failOpen=false, auth-service çökerse kanallar kapanır
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532   # secret dosyası grup okunabilir olsun (anahtar 0440, root:65532)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: lab-registry:5000/lab/auth-service:0.1.0   # build + imza: 03b-publish-images.sh
          env:
            - name: ISSUER_BASE   # dış token'ların issuer öneki (Keycloak KC_HOSTNAME)
              value: https://sso.apps.example.local:8443/realms/
            - name: JWKS_BASE     # Keycloak JWKS'inin mesh içi adresi (aşağıdaki seçicisiz Service)
              value: http://keycloak.auth.svc.cluster.local/realms/
            - name: INTERNAL_ISSUER
              value: auth.dmz.corp.mesh
            - name: INTERNAL_AUDIENCE
              value: internal-apis
            - name: SIGNING_KID
              value: internal-1
            - name: SIGNING_KEY
              value: /keys/signing.key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: signing-key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: signing-key
          secret:
            secretName: auth-signing-key   # 05b-create-data-secrets.sh (certs/auth/signing.key)
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth
  labels:
    istio.io/use-waypoint: none   # gateway'lerin ext_authz çağrısı doğrudan (ztunnel); waypoint yalnızca çıkış için
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
---
# --- Çıkış: Keycloak JWKS (mgmt) ---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: auth
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: keycloak-via-egress
  namespace: auth
spec:
  hosts:
    - keycloak.auth.svc.cluster.local
  http:
    - rewrite:
        authority: sso.apps.example.local   # egress gateway bu adla Keycloak'a yönlendirir
      route:
        - destination:
            host: dmz-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 443
      timeout: 5s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-options
  namespace: auth
data:
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: auth
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-options
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# --- Yetkilendirme ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-nothing
  namespace: auth
spec: {}
---
# auth-service'e yalnızca dört kanal gateway'i (ztunnel, L4)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: auth-service-allow-gateways
  namespace: auth
spec:
  selector:
    matchLabels:
      app: auth-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-ingress/sa/dmz-ingressgateway
              - corp.mesh/ns/istio-mobile/sa/mobile-gateway
              - corp.mesh/ns/istio-partner/sa/partner-gateway
              - corp.mesh/ns/istio-branch/sa/branch-gateway
      to:
        - operation:
            ports: ["8080"]
---
# Keycloak çıkışını yalnızca auth-service, yalnızca JWKS okuması için kullanabilir (waypoint, L7)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: keycloak-allow-auth-service
  namespace: auth
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: keycloak
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/auth/sa/auth-service
      to:
        - operation:
            methods: ["GET"]
            paths: ["/realms/{*}/protocol/openid-connect/certs"]
