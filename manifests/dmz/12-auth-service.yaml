# auth-service (services/auth-service): kanal gateway'lerinin ext_authz servisi (dokümandaki auth-proxy).
#   kanal gateway'i / web-token-handler --ext_authz (HTTP)--> auth-service --> [keycloak Service, waypoint]
#   --> dmz-egressgateway --> mgmt Keycloak (introspection + RFC 8693 token exchange)
# Dış token'ı IdP'de introspect eder, kanal kurallarını uygular, iç JWT'yi Keycloak'tan alır (09a). İmza anahtarı yok.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth
spec:
  replicas: 1   # gerçekte en az 2: ext_authz failOpen=false, auth-service çökerse kanallar kapanır
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        version: v1
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532   # secret dosyası (attest.pub, 0440) grup okunabilir olsun
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth
          image: lab-registry:5000/lab/auth-service:0.4.0   # build + imza: 03b-publish-images.sh
          env:
            - name: ISSUER_BASE   # token'ların issuer öneki (Keycloak KC_HOSTNAME)
              value: https://sso.apps.example.local:8443/realms/
            - name: IDP_BASE      # Keycloak'ın mesh içi adresi (aşağıdaki seçicisiz Service)
              value: http://keycloak.auth.svc.cluster.local/realms/
            - name: INTERNAL_AUDIENCE
              value: internal-apis
            # Mobil kanal (09c · mobile-binding): DPoP, attestation, kayıtlı cihaz
            - name: MOBILE_ORIGIN       # DPoP htu: istemcinin gördüğü adres
              value: https://mobile-api.apps.example.local:8443
            - name: MIN_APP_VERSION     # GW-06
              value: "3.0.0"
            - name: REGISTRY_URL        # aşağıdaki seçicisiz Service (waypoint -> egress -> mgmt)
              value: http://device-registry.auth.svc.cluster.local
            - name: VALKEY_ADDR
              value: valkey.auth.svc.cluster.local:6379
            - name: ATTEST_PUBLIC_KEY
              value: /attest/attest.pub
          envFrom:
            - secretRef:
                name: auth-exchange-clients   # AUTH_{WEB,MOBILE,PARTNER,BRANCH}_SECRET (05b-create-data-secrets.sh)
            - secretRef:
                name: auth-dpop-store         # VALKEY_USER, VALKEY_PASSWORD: DPoP jti tekrar deposu (09c)
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: attest
              mountPath: /attest
              readOnly: true
      volumes:
        - name: attest
          secret:
            secretName: attest-public   # yalnızca açık anahtar (05b-create-data-secrets.sh)
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth
  labels:
    istio.io/use-waypoint: none   # gateway'lerin ext_authz çağrısı doğrudan (ztunnel); waypoint yalnızca çıkış için
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
---
# --- Çıkış: Keycloak introspection ve token exchange (mgmt) ---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: auth
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: keycloak-via-egress
  namespace: auth
spec:
  hosts:
    - keycloak.auth.svc.cluster.local
  http:
    - rewrite:
        authority: sso.apps.example.local   # egress gateway bu adla Keycloak'a yönlendirir
      route:
        - destination:
            host: dmz-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 443
      timeout: 5s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-options
  namespace: auth
data:
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: auth
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-options
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
# --- Çıkış: device-registry (mgmt, yalnızca sorgu) ve DPoP jti deposu (mgmt Valkey), 09c ---
apiVersion: v1
kind: Service
metadata:
  name: device-registry
  namespace: auth
spec:
  ports:
    - name: http
      port: 80
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: device-registry-via-egress
  namespace: auth
spec:
  hosts:
    - device-registry.auth.svc.cluster.local
  http:
    - rewrite:
        authority: devices.mgmt.internal   # egress gateway ve mgmt girişi bu adla yönlendirir
      route:
        - destination:
            host: dmz-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 443
      timeout: 3s
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: auth
spec:
  ports:
    - name: tcp-valkey
      port: 6379
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: valkey-via-egress
  namespace: auth
spec:
  hosts:
    - valkey.auth.svc.cluster.local
  tcp:
    - route:
        - destination:
            host: dmz-egressgateway.istio-egress.svc.cluster.local
            port:
              number: 16379
---
# --- Yetkilendirme ---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-nothing
  namespace: auth
spec: {}
---
# auth-service'e yalnızca kanal gateway'leri ve web'de web-token-handler (ztunnel, L4). x-auth-channel'a bu yüzden
# güvenilir: header'ı yalnızca bu kimlikler gönderebilir.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: auth-service-allow-gateways
  namespace: auth
spec:
  selector:
    matchLabels:
      app: auth-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/edge-web/sa/web-token-handler
              - corp.mesh/ns/istio-mobile/sa/mobile-gateway
              - corp.mesh/ns/istio-partner/sa/partner-gateway
              - corp.mesh/ns/istio-branch/sa/branch-gateway
      to:
        - operation:
            ports: ["8080"]
---
# Keycloak çıkışını yalnızca auth-service, yalnızca introspection ve token uçları için kullanabilir (waypoint, L7)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: keycloak-allow-auth-service
  namespace: auth
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: keycloak
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/auth/sa/auth-service
      to:
        - operation:
            methods: ["POST"]
            paths: ["/realms/customers/protocol/openid-connect/token", "/realms/customers/protocol/openid-connect/token/introspect",
                    "/realms/partners/protocol/openid-connect/token", "/realms/partners/protocol/openid-connect/token/introspect",
                    "/realms/staff/protocol/openid-connect/token", "/realms/staff/protocol/openid-connect/token/introspect"]
---
# device-registry çıkışını yalnızca auth-service, yalnızca sorgu için (waypoint, L7)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: device-registry-allow-auth-service
  namespace: auth
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: device-registry
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/auth/sa/auth-service
      to:
        - operation:
            methods: ["GET"]
            paths: ["/v1/devices/lookup"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: valkey-allow-auth-service
  namespace: auth
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: valkey
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/auth/sa/auth-service
