# Secret'lar Vault'tan (13 · secrets). External Secrets (ns external-secrets) her namespace'in kendi SecretStore'u ile okur:
#   SecretStore -> vault-reader service account'unun token'ı (audience vault) -> Vault JWT auth (jwt-dmz, rol = namespace)
#   -> politika <cluster>-<namespace>: yalnızca kv/<cluster>/<namespace>/*. Başka namespace'in yolunu okuyamaz.
# Vault mgmt'te: istek namespace'in waypoint'i ve egress gateway üzerinden mTLS ile mgmt girişine gider (64-vault-exit.yaml).
# vault-reader yalnızca kimlik içindir: hiçbir pod onunla çalışmaz, token'ı otomatik bağlanmaz.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  namespace: ratelimit
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: ratelimit
spec:
  provider:
    vault:
      server: http://vault.external-secrets.svc.cluster.local
      path: kv
      version: v2
      auth:
        jwt:
          path: jwt-dmz
          role: ratelimit
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: vault-reader
              audiences: [vault]
            expirationSeconds: 600
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ratelimit-redis
  namespace: ratelimit
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: ratelimit-redis
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dmz/ratelimit/ratelimit-redis
---
