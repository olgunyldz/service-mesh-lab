# DMZ egress gateway: internal'a giden tek kapı. __NET_PREFIX__ scriptte doldurulur.
#   web-token-handler waypoint / mobile-gateway / partner-gateway / branch-gateway --mTLS--> dmz-egressgateway
#   --mTLS--> cluster-a ingress gw (LB IP)
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: zone-exit
  namespace: istio-egress
spec:
  selector:
    istio: dmz-egressgateway
  servers:
    - port:
        number: 443
        name: https-mtls
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
      # Ingress gateway Istio'nun iç SNI'ını gönderir; host listesi kısıtlanamaz.
      # Kimlik mTLS ile doğrulanır, yönlendirme VirtualService'te.
      hosts:
        - "*"
---
# Egress gateway'e (internal'a tek kapı) yalnızca kanalların arka uçları girebilir:
#   web     -> web-token-handler'ın waypoint'i (web gateway'in kendisi değil: web trafiği token handler'dan geçmek zorunda)
#   mobile  -> mobile-gateway
#   partner -> partner-gateway
#   branch  -> branch-gateway
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-channel-backends
  namespace: istio-egress
spec:
  selector:
    matchLabels:
      istio: dmz-egressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/edge-web/sa/waypoint
              - corp.mesh/ns/istio-mobile/sa/mobile-gateway
              - corp.mesh/ns/istio-partner/sa/partner-gateway
              - corp.mesh/ns/istio-branch/sa/branch-gateway
      to:
        - operation:
            ports: ["443"]   # yalnızca zone-exit; veri çıkışı (16379) ayrı politikada (26-global-rate-limit.yaml)
---
# Kanal gateway'leri ve BFF waypoint'i -> egress gateway: mesh kimlikleriyle mTLS.
# Servisin kendi namespace'inde: tüm istemci namespace'leri için geçerli.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: dmz-egressgateway
  namespace: istio-egress
spec:
  host: dmz-egressgateway.istio-egress.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: cluster-a-gateway
  namespace: istio-egress
spec:
  hosts:
    - cluster-a.internal.mesh
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 443
      name: http-mtls
      protocol: HTTP
  endpoints:
    - address: __NET_PREFIX__.201.10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: cluster-a-gateway
  namespace: istio-egress
spec:
  host: cluster-a.internal.mesh
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      sni: api-a.apps.example.local
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: zone-exit-api-a
  namespace: istio-egress
spec:
  hosts:
    - api-a.apps.example.local
    - web-bff.apps.example.local   # web kanalının BFF'i (internal, 09a); token handler'dan gelir
  gateways:
    - zone-exit
  http:
    - route:
        - destination:
            host: cluster-a.internal.mesh
            port:
              number: 443
# cluster-b'ye çıkış: cluster-b/31-cluster-b-gateway.yaml (yalnızca cluster-b aktifken uygulanır)
---
# --- Kimlik çıkışı (08, 09a): SSO istekleri, auth-service ve web-token-handler -> mgmt Keycloak ---
#   web gateway (müşteri/partner login) · branch-gateway (personel login) · auth waypoint (introspection, exchange)
#   · edge-web waypoint (code değişimi, refresh, logout)
#   --mTLS--> dmz-egressgateway --mTLS (SNI keycloak.mgmt.internal)--> mgmt ingress gw --> iam/keycloak
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: mgmt-keycloak
  namespace: istio-egress
spec:
  hosts:
    - keycloak.mgmt.internal
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 443
      name: http-mtls
      protocol: HTTP
  endpoints:
    - address: __NET_PREFIX__.203.10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mgmt-keycloak
  namespace: istio-egress
spec:
  host: keycloak.mgmt.internal
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      sni: keycloak.mgmt.internal
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: zone-exit-sso
  namespace: istio-egress
spec:
  hosts:
    - sso.apps.example.local
  gateways:
    - zone-exit
  http:
    - rewrite:
        authority: keycloak.mgmt.internal   # mgmt ingress gateway bu adla eşleşir; Keycloak issuer'ı KC_HOSTNAME'den
      route:
        - destination:
            host: keycloak.mgmt.internal
            port:
              number: 443
---
# SSO çıkışı: kim, hangi realm'e. Web gateway'in API host'larına çıkışı yine yok (yalnızca sso host'u).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-sso-exit
  namespace: istio-egress
spec:
  selector:
    matchLabels:
      istio: dmz-egressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-ingress/sa/dmz-ingressgateway
      to:
        - operation:
            hosts: ["sso.apps.example.local"]
            ports: ["443"]
            paths: ["/realms/customers/*", "/realms/partners/*", "/resources/*"]
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-branch/sa/branch-gateway
      to:
        - operation:
            hosts: ["sso.apps.example.local"]
            ports: ["443"]
            paths: ["/realms/staff/*"]
    - from:
        - source:
            principals:
              - corp.mesh/ns/auth/sa/waypoint
      to:
        - operation:   # introspection + token exchange (09a)
            hosts: ["sso.apps.example.local"]
            ports: ["443"]
            methods: ["POST"]
            paths: ["/realms/customers/protocol/openid-connect/token", "/realms/customers/protocol/openid-connect/token/introspect",
                    "/realms/partners/protocol/openid-connect/token", "/realms/partners/protocol/openid-connect/token/introspect",
                    "/realms/staff/protocol/openid-connect/token", "/realms/staff/protocol/openid-connect/token/introspect"]
    - from:
        - source:
            principals:
              - corp.mesh/ns/edge-web/sa/waypoint
      to:
        - operation:   # web-token-handler: code değişimi, refresh, logout (09a)
            hosts: ["sso.apps.example.local"]
            ports: ["443"]
            methods: ["POST"]
            paths: ["/realms/customers/protocol/openid-connect/token", "/realms/customers/protocol/openid-connect/logout"]
---
# --- Veri çıkışı (07 · data): global rate limit sayaçları -> mgmt Valkey ---
#   ratelimit waypoint --mTLS--> dmz-egressgateway :16379 --mTLS (SNI valkey.mgmt.internal)--> mgmt :6379
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: data-exit
  namespace: istio-egress
spec:
  selector:
    istio: dmz-egressgateway
  servers:
    - port:
        number: 16379
        name: tls-valkey
        protocol: TLS
      tls:
        mode: ISTIO_MUTUAL
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: mgmt-valkey
  namespace: istio-egress
spec:
  hosts:
    - valkey.mgmt.internal
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 6379
      name: tcp-valkey
      protocol: TCP
  endpoints:
    - address: __NET_PREFIX__.203.10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mgmt-valkey
  namespace: istio-egress
spec:
  host: valkey.mgmt.internal
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      sni: valkey.mgmt.internal
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: data-exit
  namespace: istio-egress
spec:
  hosts: ["*"]
  gateways:
    - data-exit
  tcp:
    - match:
        - port: 16379
      route:
        - destination:
            host: valkey.mgmt.internal
            port:
              number: 6379
---
# Veri çıkışına yalnızca ratelimit'in ve web-token-handler'ın (oturum deposu, 09a) waypoint'i, yalnızca Valkey portundan.
# DMZ'den PostgreSQL'e çıkış yok. Valkey ACL'i ayrıca anahtar önekini sınırlar (rl:*, sess:*).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-data-exit
  namespace: istio-egress
spec:
  selector:
    matchLabels:
      istio: dmz-egressgateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/ratelimit/sa/waypoint
              - corp.mesh/ns/edge-web/sa/waypoint
      to:
        - operation:
            ports: ["16379"]
