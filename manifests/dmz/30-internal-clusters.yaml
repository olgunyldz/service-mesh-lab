# Internal cluster'ların ingress gateway'leri (MetalLB IP'leri). __NET_PREFIX__ scriptte doldurulur.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: cluster-a-gateway
  namespace: istio-ingress
spec:
  hosts:
    - cluster-a.internal.mesh
  location: MESH_EXTERNAL
  resolution: STATIC
  ports:
    - number: 443
      name: http-mtls
      protocol: HTTP
  endpoints:
    - address: __NET_PREFIX__.201.10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: cluster-a-gateway
  namespace: istio-ingress
spec:
  host: cluster-a.internal.mesh
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      sni: api-a.apps.example.local
# cluster-b gateway'i: cluster-b/31-cluster-b-gateway.yaml (yalnızca cluster-b aktifken uygulanır)
