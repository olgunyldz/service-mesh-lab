# Edge (HAProxy + WAF) artık Kubernetes dışında: scripts/06b-deploy-edge.sh
apiVersion: v1
kind: Namespace
metadata:
  name: istio-ingress
  labels:
    zone: dmz
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-egress
  labels:
    zone: dmz
    pod-security.kubernetes.io/enforce: restricted
---
# Kanal gateway'leri (06 · dmz-channels): her kanalın kendi namespace'i (ayrı RBAC, secret, politika sınırı)
apiVersion: v1
kind: Namespace
metadata:
  name: istio-mobile
  labels:
    zone: dmz
    channel: mobile
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-partner
  labels:
    zone: dmz
    channel: partner
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-branch
  labels:
    zone: dmz
    channel: branch
    pod-security.kubernetes.io/enforce: restricted
---
# Web kanalının DMZ bileşeni (09a): web-token-handler (cookie oturumu <-> token). İş mantığı yok; BFF internal'da.
# Ambient mesh'te; yalnızca imzalı image'lar (Kyverno). Waypoint yalnızca çıkış servisleri için (Keycloak, Valkey, BFF).
apiVersion: v1
kind: Namespace
metadata:
  name: edge-web
  labels:
    zone: dmz
    channel: web
    istio.io/dataplane-mode: ambient
    policy.corp.mesh/image-source: lab-registry
    pod-security.kubernetes.io/enforce: restricted
---
# Global rate limit servisi (07 · data): sayaçlar mgmt'teki Valkey'de
apiVersion: v1
kind: Namespace
metadata:
  name: ratelimit
  labels:
    zone: dmz
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
    policy.corp.mesh/image-source: lab-registry
    pod-security.kubernetes.io/enforce: restricted
---
# Kimlik (08 · token-exchange): kanal gateway'lerinin ext_authz servisi. İç JWT imza anahtarı yalnızca burada
apiVersion: v1
kind: Namespace
metadata:
  name: auth
  labels:
    zone: dmz
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
    policy.corp.mesh/image-source: lab-registry
    pod-security.kubernetes.io/enforce: restricted
