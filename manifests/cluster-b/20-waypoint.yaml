# Waypoint: api-b namespace'i için L7 proxy (Gateway API, istio-waypoint class).
# Namespace "restricted" Pod Security kullandığı için üretilen deployment'a seccomp eklenir
# (OpenShift'te restricted-v2 SCC bunu otomatik yapar).
apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-options
  namespace: api-b
data:
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: api-b
  labels:
    # Yalnızca servis trafiği (bkz. cluster-a/20-waypoint.yaml: "all" ile pod IP üzerinden L7 AuthZ atlanabiliyordu)
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: waypoint-options
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
