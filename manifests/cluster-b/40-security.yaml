# Mesh içi zorunlu mTLS
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# api-b'ya sadece internal ingress gateway erişebilir (waypoint'te L7 olarak uygulanır)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-b-allow-ingress
  namespace: api-b
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: api-b
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - corp.mesh/ns/istio-ingress/sa/istio-ingressgateway
      to:
        - operation:
            methods: ["GET", "POST"]
