# api-b: podinfo. DMZ ve cluster-a egress gateway üzerinden çağrılır.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-b
  namespace: api-b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-b
  namespace: api-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-b
  template:
    metadata:
      labels:
        app: api-b
        version: v1
    spec:
      serviceAccountName: api-b
      securityContext:
        runAsNonRoot: true
        runAsUser: 100   # imajdaki "app" kullanıcısı
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command:
            - ./podinfo
            - --port=9898
            - --level=info
          env:
            - name: PODINFO_UI_MESSAGE
              value: "api-b @ cluster-b"
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # yazılabilir yerler yalnızca aşağıdaki emptyDir'ler
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-b
  namespace: api-b
  labels:
    istio.io/ingress-use-waypoint: "true"   # ingress gateway trafiği de waypoint'ten geçsin
spec:
  selector:
    app: api-b
  ports:
    - name: http
      port: 80
      targetPort: 9898
