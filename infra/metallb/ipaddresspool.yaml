# __POOL_PREFIX__ scriptte cluster'a göre doldurulur (örn. 172.18.201)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
    - __POOL_PREFIX__.10-__POOL_PREFIX__.50
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool
