# Kyverno (helm kyverno/kyverno) - her cluster'da admission controller
global:
  image:
    # Chart varsayılanı reg.kyverno.io; registry önbelleğinde yok. Aynı image'lar ghcr.io'da da yayınlanıyor.
    registry: ghcr.io

admissionController:
  replicas: 1                     # tek node; gerçekte 3 (webhook çökerse pod oluşturma durur)
  container:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 384Mi }
  # Yük altında (CPU/bellek baskısı) varsayılan başlangıç süresi (20 x 6 sn) yetmiyor; Kyverno yeniden başlatılıyor ve
  # webhook fail-closed olduğu için o sırada cluster'da hiçbir pod oluşturulamıyor (08 · token-exchange'te yaşandı).
  startupProbe:
    httpGet: { path: /health/liveness, port: 9443, scheme: HTTPS }
    failureThreshold: 60
    initialDelaySeconds: 2
    periodSeconds: 6
  livenessProbe:
    httpGet: { path: /health/liveness, port: 9443, scheme: HTTPS }
    failureThreshold: 4
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5

# Arka plan tarama ve ihlal raporları (PolicyReport). Audit modunda mevcut kaynakları da raporlar.
reportsController:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# generate / mutate-existing ve temizleme politikaları kullanılmıyor; bellek için kapalı
backgroundController:
  enabled: false
cleanupController:
  enabled: false

features:
  policyExceptions:
    enabled: true
    namespace: kyverno            # istisnalar yalnızca kyverno namespace'inde tanımlanabilir (merkezi denetim)
  registryClient:
    allowInsecure: true           # lab registry düz HTTP (lab istisnası)
