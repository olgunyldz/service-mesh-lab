# Istio grafana addon'u ClusterIP'dir; host'tan erişim için ek NodePort servisi.
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300   # kind extraPortMappings -> host 3001/3002/3003
