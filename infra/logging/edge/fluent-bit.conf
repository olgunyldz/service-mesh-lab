# Edge log toplayıcısı (10 · logging): Kubernetes dışındaki edge container'ları (edge-lb, edge-waf, branch-fw).
# 07b-setup-logging.sh "edge-logs" container'ında çalıştırır. Docker'ın json-file loglarını okur; yalnızca
# log.name etiketi olan container'lar alınır (06b/06c: --label log.name=... --log-opt labels=log.name,log.category).
# mgmt ingress gateway'e Log CA'nın verdiği istemci sertifikasıyla (mTLS, SNI logs-edge.mgmt.internal) gider.
[SERVICE]
    Flush            2
    Log_Level        warn
    json.escape_unicode Off
    Parsers_File     /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /dc/*/*-json.log
    Parser            docker
    Tag               edge
    DB                /state/edge.db
    Mem_Buf_Limit     8MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name              lua
    Match             edge
    script            /fluent-bit/etc/edge.lua
    call              enrich

# WAF engellemeleri security'ye de kopyalanır
[FILTER]
    Name              rewrite_tag
    Match             edge
    Rule              $security_copy ^yes$ secdup true
    Emitter_Name      security_copy
    Emitter_Mem_Buf_Limit 4MB

[FILTER]
    Name              lua
    Match             secdup
    script            /fluent-bit/etc/edge.lua
    call              to_security

[OUTPUT]
    Name              loki
    Match             edge
    Host              logs-edge.mgmt.internal
    Port              443
    tls               On
    tls.verify        On
    tls.ca_file       /certs/ca.pem
    tls.crt_file      /certs/edge-logs.crt
    tls.key_file      /certs/edge-logs.key
    tenant_id         network
    labels            category=network, zone=$zone, cluster=$cluster, namespace=$kubernetes['namespace'], container=$kubernetes['container']
    remove_keys       zone, cluster, category
    line_format       json
    Retry_Limit       5

[OUTPUT]
    Name              loki
    Match             secdup
    Host              logs-edge.mgmt.internal
    Port              443
    tls               On
    tls.verify        On
    tls.ca_file       /certs/ca.pem
    tls.crt_file      /certs/edge-logs.crt
    tls.key_file      /certs/edge-logs.key
    tenant_id         security
    labels            category=security, zone=$zone, cluster=$cluster, namespace=$kubernetes['namespace'], container=$kubernetes['container']
    remove_keys       zone, cluster, category
    line_format       json
    Retry_Limit       5
