# DMZ cluster: dış dünyaya açık tek cluster.
# Host'tan 8080/8443 -> edge-lb (HAProxy) NodePort 30080/30443
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dmz
# Registry mirror tanımlarını /etc/containerd/certs.d altından oku (bkz. scripts/lib.sh configure_node_mirrors)
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  podSubnet: 10.10.0.0/16
  serviceSubnet: 10.110.0.0/16
nodes:
  - role: control-plane
    labels:
      zone: dmz
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
      # Gözlemlenebilirlik: Kiali / Grafana NodePort
      - containerPort: 30201
        hostPort: 20001
        protocol: TCP
      - containerPort: 30300
        hostPort: 3001
        protocol: TCP
  - role: worker
    labels:
      zone: dmz
      node-role: infra   # node-role.kubernetes.io/* kubelet tarafından eklenemez
