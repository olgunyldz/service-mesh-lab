# DMZ cluster (iç DMZ): internet paketini doğrudan almaz; yalnızca edge-waf'tan gelen trafiği alır.
# Host'a hiç port açmaz (8080/8443 edge-lb container'ında; Kiali/Grafana mgmt cluster'ında).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dmz
# Registry mirror tanımlarını /etc/containerd/certs.d altından oku (bkz. scripts/lib.sh configure_node_mirrors)
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  podSubnet: 10.10.0.0/16
  serviceSubnet: 10.110.0.0/16
# Tek node: makinenin RAM'i (15,7 GB) 4 cluster × 2 node'a yetmiyor. kind, worker yoksa
# control-plane taint'ini kaldırır; tüm pod'lar bu node'da çalışır. İleride 2 node'a çıkmak için
# aşağıya "- role: worker" eklenir (bkz. docs/01-kiali.md).
nodes:
  - role: control-plane
    labels:
      zone: dmz
      node-role: infra   # node-role.kubernetes.io/* kubelet tarafından eklenemez
