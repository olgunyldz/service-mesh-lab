# Internal cluster B: uygulama trafiği için dışarıya port açmaz, sadece DMZ'den ve cluster-a egress'inden erişilir.
# Host'a yalnızca yönetim araçları (Kiali / Grafana) açılır.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cluster-b
# Registry mirror tanımlarını /etc/containerd/certs.d altından oku (bkz. scripts/lib.sh configure_node_mirrors)
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  podSubnet: 10.30.0.0/16
  serviceSubnet: 10.130.0.0/16
nodes:
  - role: control-plane
    labels:
      zone: internal
    extraPortMappings:
      - containerPort: 30201
        hostPort: 20003
        protocol: TCP
      - containerPort: 30300
        hostPort: 3003
        protocol: TCP
  - role: worker
    labels:
      zone: internal
      node-role: worker
