# 12 · traffic-mgmt testi: account-api VirtualService'inin hata enjeksiyonlu hali. 08-verify.sh geçici uygular ve
# ardından manifests/cluster-a/18-traffic-policies.yaml'ı geri yükler. Kalıcı olarak uygulanmaz.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: account-api
  namespace: account-api
spec:
  hosts:
    - account-api.account-api.svc.cluster.local
  http:
    # Yalnızca test sırasında ve yalnızca bu User-Agent'la: 5 sn gecikme / 503.
    # User-Agent seçildi: DMZ token handler yalnızca izinli header'ları iletir (özel test header'ı internal'a ulaşmaz).
    # Envoy enjekte gecikmeyi router'dan önce uygular: gecikme rotanın zaman aşımına sayılmaz. Zaman aşımı gerçek bir
    # yavaş yanıtla sınanır (api-a, podinfo /delay/N; 08-verify.sh).
    - name: fault-delay
      match:
        - headers:
            user-agent:
              exact: lab-fault-delay
      fault:
        delay:
          percentage:
            value: 100
          fixedDelay: 5s
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v1
    - name: fault-abort
      match:
        - headers:
            user-agent:
              exact: lab-fault-abort
      fault:
        abort:
          percentage:
            value: 100
          httpStatus: 503
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v1
    - name: read
      match:
        - method:
            exact: GET
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v2
          weight: 10
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,503
    - name: write   # POST (transfer, onay): yeniden deneme yok
      route:
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v1
          weight: 90
        - destination:
            host: account-api.account-api.svc.cluster.local
            subset: v2
          weight: 10
      timeout: 5s
      retries:
        attempts: 0
