# istio/gateway chart - egress gateway. Dışarıya açılmaz (ClusterIP).
service:
  type: ClusterIP
  ports:
    - name: http2
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    # Veri çıkışı (07 · data): waypoint'ten gelen mTLS'li TCP, mgmt'e iletilir
    - name: tls-postgres
      port: 15432
      targetPort: 15432
    - name: tls-valkey
      port: 16379
      targetPort: 16379
autoscaling:
  enabled: false
replicaCount: 1
# Pod Security "restricted" için seccomp. securityContext verildiğinde chart'ın varsayılan
# sysctl'i (80/443'e root olmadan bağlanma) düştüğü için birlikte tanımlanır.
securityContext:
  seccompProfile:
    type: RuntimeDefault
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
