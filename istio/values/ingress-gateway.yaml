# istio/gateway chart - ingress gateway. Sabit LB IP'si scriptte annotation ile verilir.
service:
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: http2
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
autoscaling:
  enabled: false
replicaCount: 1
