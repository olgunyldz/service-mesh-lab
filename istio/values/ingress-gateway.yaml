# istio/gateway chart - ingress gateway. Sabit LB IP'si scriptte annotation ile verilir.
service:
  type: LoadBalancer
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: http2
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
autoscaling:
  enabled: false
replicaCount: 1
# Pod Security "restricted" için seccomp. securityContext verildiğinde chart'ın varsayılan
# sysctl'i (80/443'e root olmadan bağlanma) düştüğü için birlikte tanımlanır.
securityContext:
  seccompProfile:
    type: RuntimeDefault
  sysctls:
    - name: net.ipv4.ip_unprivileged_port_start
      value: "0"
