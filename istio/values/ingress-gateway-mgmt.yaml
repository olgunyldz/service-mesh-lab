# Yalnızca mgmt istio-ingressgateway için (ingress-gateway.yaml'ın üzerine): veri girişi portları.
# Liste bütün olarak değiştiği için mevcut portlar da tekrar yazılır.
service:
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: http2
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: tls-postgres
      port: 5432
      targetPort: 5432
    - name: tls-valkey
      port: 6379
      targetPort: 6379
