# Şube WAN'ı ile DMZ arasındaki iç firewall (simülasyon). Yalnızca branch-gateway'in 443 portuna TCP iletir;
# TLS'e dokunmaz (terminalin cihaz sertifikası gateway'de doğrulanır). Başka hiçbir hedefe yol yok.
global
  log stdout format raw local0
  maxconn 500

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend branch_wan
  bind :443
  # Şube başına bağlantı sınırı (terminal sayısı sınırlı)
  stick-table type ip size 10k expire 30s store conn_cur
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc_conn_cur(0) gt 20 }
  default_backend branch_gateway

backend branch_gateway
  server gw "${BRANCH_GW}" check
