# Edge load balancer (dış DMZ). Kubernetes dışında, edge-net ağında çalışır.
# İnternet -> :8443 (TLS) -> edge-waf:8080 -> DMZ ingress gateway
global
  log stdout format raw local0
  maxconn 2000
  # TLS 1.2+ ve yalnızca modern cipher'lar
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

resolvers docker
  nameserver dns 127.0.0.11:53

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-request 5s       # slow-loris: başlıklar 5 sn içinde tamamlanmalı
  timeout http-keep-alive 5s

# HTTP yalnızca HTTPS'e yönlendirir
frontend http_in
  bind :8080
  http-request redirect location https://%[req.hdr(host),field(1,:)]:8443%[capture.req.uri] code 301

frontend https_in
  bind :8443 ssl crt /usr/local/etc/haproxy/certs/edge.pem alpn h2,http/1.1

  # IP başına bağlantı ve istek hızı sınırı
  stick-table type ip size 100k expire 30s store conn_cur,http_req_rate(10s)
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc_conn_cur(0) gt 50 }
  http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

  # İstek doğrulama: Host zorunlu, gövde en fazla 1 MB
  http-request deny deny_status 400 if !{ req.hdr(host) -m found }
  http-request deny deny_status 413 if { req.hdr_val(content-length) gt 1048576 }

  # Dışarıdan gelen proxy ve iç kimlik header'larına güvenme: sil, kendin yaz
  http-request del-header X-Forwarded-For
  http-request del-header X-Forwarded-Host
  http-request del-header X-Forwarded-Proto
  http-request del-header X-Forwarded-Port
  http-request del-header X-Real-IP
  http-request del-header Forwarded
  http-request del-header x-user-jwt
  option forwardfor
  http-request set-header X-Forwarded-Proto https

  http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

  # İç yapıyı ele veren yanıt header'larını sil (Envoy, nginx, upstream süreleri)
  http-response del-header Server
  http-response del-header X-Powered-By
  http-response del-header X-Envoy-Upstream-Service-Time
  http-response del-header X-Envoy-Decorator-Operation

  # 5xx yanıtlarında gövdeyi tek tip yap: stack trace, iç IP, hostname dışarı sızmasın
  # (durum kodu korunur, yalnızca gövde değişir)
  http-response return status 500 content-type application/json string '{"error":"internal_error"}' if { status 500 }
  http-response return status 502 content-type application/json string '{"error":"bad_gateway"}' if { status 502 }
  http-response return status 503 content-type application/json string '{"error":"service_unavailable"}' if { status 503 }
  http-response return status 504 content-type application/json string '{"error":"gateway_timeout"}' if { status 504 }

  default_backend waf

backend waf
  server waf edge-waf:8080 check resolvers docker init-addr last,libc,none
